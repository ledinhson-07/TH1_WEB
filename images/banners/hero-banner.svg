  <polygon points="720,280 723,288 731,291 723,294 720,302 717,294 709,291 717,288" fill="#F472B6"/>
  <g transform="translate(480, 100)" filter="url(#softShadow)">
    <!-- Cat Squishy -->
    <ellipse cx="140" cy="180" rx="90" ry="75" fill="#FFFFFF" stroke="#F5F5F5" stroke-width="4"/>
    <polygon points="75,120 55,70 105,95" fill="#FFFFFF"/>
    <polygon points="75,115 62,80 95,98" fill="#F8C8DC"/>
    <polygon points="205,120 225,70 175,95" fill="#FFFFFF"/>

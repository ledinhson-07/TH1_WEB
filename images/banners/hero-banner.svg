    <circle cx="175" cy="175" r="7" fill="#493B43"/>
    <circle cx="90" cy="185" r="10" fill="#F8C8DC"/>
    <circle cx="190" cy="185" r="10" fill="#F8C8DC"/>
    <polygon points="140,183 135,178 145,178" fill="#F06292"/>
    <path d="M 135,185 Q 140,192 145,185" stroke="#493B43" stroke-width="3" fill="none" stroke-linecap="round"/>

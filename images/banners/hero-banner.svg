  <circle cx="700" cy="80" r="60" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="740" cy="70" r="40" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="100" cy="380" r="80" fill="#FFFFFF" opacity="0.5"/>

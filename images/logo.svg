<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" width="280" height="90">
  <defs>
    <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#F8C8DC" />
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF" />
      <stop offset="100%" stop-color="#DCCBFA" />
    </linearGradient>
    <linearGradient id="gradPeach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F2" />
      <stop offset="100%" stop-color="#FFE0D0" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#493B43" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="none" rx="16"/>
  
  <g transform="translate(20, 15)">
    <circle cx="45" cy="45" r="35" fill="#F8C8DC" filter="url(#softShadow)"/>
    <ellipse cx="45" cy="46" rx="28" ry="24" fill="#FFFFFF"/>
    <!-- cute face on logo cloud -->
    <circle cx="37" cy="43" r="3.5" fill="#493B43"/>
    <circle cx="53" cy="43" r="3.5" fill="#493B43"/>
    <circle cx="34" cy="48" r="3.5" fill="#F06292" opacity="0.6"/>
    <circle cx="56" cy="48" r="3.5" fill="#F06292" opacity="0.6"/>
    <path d="M 42 48 Q 45 52 48 48" stroke="#493B43" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Star sparkle -->
    <polygon points="72,20 75,27 82,30 75,33 72,40 69,33 62,30 69,27" fill="#FFD166"/>
    <text x="95" y="46" font-family="'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#F06292">SQUISHY</text>
    <text x="95" y="68" font-family="'Nunito', 'Segoe UI', sans-serif" font-weight="800" font-size="18" fill="#493B43" letter-spacing="3">WORLD</text>

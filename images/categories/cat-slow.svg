<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <defs>
    <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#F8C8DC" />
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF" />
      <stop offset="100%" stop-color="#DCCBFA" />
    </linearGradient>
    <linearGradient id="gradPeach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F2" />
      <stop offset="100%" stop-color="#FFE0D0" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#493B43" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#FFF8F2" rx="16"/>
  
  <g transform="translate(80, 100)" filter="url(#softShadow)">
    <!-- rainbow ribbons below -->
    <path d="M 60,130 Q 70,190 70,210" stroke="#F87171" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 80,130 Q 90,190 90,210" stroke="#FBBF24" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 100,130 Q 110,190 110,210" stroke="#34D399" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 120,130 Q 130,190 130,210" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 140,130 Q 150,190 150,210" stroke="#A78BFA" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- cloud body -->
    <ellipse cx="70" cy="110" rx="40" ry="35" fill="#FFFFFF"/>
    <ellipse cx="120" cy="80" rx="50" ry="45" fill="#FFFFFF"/>
    <ellipse cx="170" cy="110" rx="40" ry="35" fill="#FFFFFF"/>
    <rect x="70" y="100" width="100" height="35" fill="#FFFFFF"/>
    <!-- face -->
    <circle cx="95" cy="105" r="5" fill="#493B43"/>
    <circle cx="145" cy="105" r="5" fill="#493B43"/>
    <circle cx="80" cy="112" r="7" fill="#F8C8DC"/>
    <circle cx="160" cy="112" r="7" fill="#F8C8DC"/>
    <path d="M 115,112 Q 120,118 125,112" stroke="#493B43" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

</svg>
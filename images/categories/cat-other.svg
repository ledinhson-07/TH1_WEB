<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#493B43" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#FFF8F2" rx="16"/>
  <!-- Sparkly butter and stress ball icons -->
  <g transform="translate(45, 45)" filter="url(#softShadow)">
    <circle cx="80" cy="80" r="60" fill="#E0F2FE"/>
    <!-- butter bar -->
    <rect x="35" y="65" width="90" height="40" rx="8" fill="#FDE047" stroke="#EAB308" stroke-width="4"/>
    <text x="50" y="90" font-family="'Nunito', sans-serif" font-weight="900" font-size="14" fill="#854D0E">BUTTER</text>
    <!-- sparkles -->
    <polygon points="120,35 123,43 131,46 123,49 120,57 117,49 109,46 117,43" fill="#F43F5E"/>
    <polygon points="40,40 42,46 48,48 42,50 40,56 38,50 32,48 38,46" fill="#38BDF8"/>
  </g>
</svg>